<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroDuck 3D Lab</title><style>
:root{color-scheme:dark;--bg:#071018;--panel:#0e1b26ed;--line:#20394b;--cyan:#42d7e8;--green:#59e391;--red:#ff5d6c;--muted:#8fa6b5;--text:#e8f5fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 15%,#12324a 0,#071018 45%,#04090d 100%);font:14px/1.45 Inter,Segoe UI,sans-serif;color:var(--text);overflow:hidden}#app{height:100vh;display:grid;grid-template-columns:340px 1fr}.panel{padding:24px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;backdrop-filter:blur(18px)}.brand{display:flex;gap:14px;align-items:center;margin-bottom:22px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--cyan),#2372ff);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 30px #25bdd044}.brand h1{font-size:20px;margin:0}.brand p{color:var(--muted);margin:2px 0 0;font-size:12px}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #275067;border-radius:99px;padding:6px 10px;color:#a7d7e5;background:#0d2634;margin-bottom:18px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid var(--line);background:#0b1720;border-radius:12px;padding:11px}.metric b{display:block;font-size:17px;color:white}.metric span{font-size:11px;color:var(--muted)}button{width:100%;border:1px solid #2a5268;background:#102b39;color:#dff8ff;border-radius:11px;padding:11px 12px;margin:5px 0;font-weight:650;cursor:pointer;transition:.2s}button:hover{border-color:var(--cyan);transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,#1fa9bd,#266dec);border:0}.danger{background:#32151c;border-color:#71303b;color:#ffb7be}.danger.active{background:var(--red);color:white;box-shadow:0 0 30px #ff5d6c66}.slider{margin:11px 0}.slider label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.slider input{width:100%;accent-color:var(--cyan)}.joints{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.joint{display:flex;justify-content:space-between;padding:6px 8px;border-radius:7px;background:#0a151d;color:var(--muted)}.joint strong{color:#d9f4fb}.stage{position:relative;min-width:0}canvas{width:100%;height:100%;display:block;cursor:grab}canvas:active{cursor:grabbing}.hud{position:absolute;top:20px;left:20px;border:1px solid var(--line);background:#09151dcf;border-radius:12px;padding:10px 13px;color:var(--muted);pointer-events:none}.hud strong{color:var(--green)}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#8da3b0;background:#071018aa;border:1px solid #203543;padding:7px 12px;border-radius:99px;font-size:12px}@media(max-width:820px){#app{grid-template-columns:1fr}.panel{position:absolute;z-index:2;width:290px;height:100%;transform:translateX(-250px);transition:.2s}.panel:hover{transform:none}}
</style></head><body><div id="app"><aside class="panel"><div class="brand"><div class="logo">🦆</div><div><h1>MicroDuck 3D Lab</h1><p>Software Bring-up MVP v0.3</p></div></div><div class="badge"><i class="dot"></i><span id="status">DRY-RUN · CONNECTED</span></div><h2>Telemetry</h2><div class="grid"><div class="metric"><b id="fps">60</b><span>FPS</span></div><div class="metric"><b>50 Hz</b><span>Control loop</span></div><div class="metric"><b>6.0 V</b><span>Servo rail</span></div><div class="metric"><b id="imu">0.0°</b><span>IMU roll</span></div></div><h2>Control</h2><button class="primary" id="neutral">Neutral pose</button><button id="animate">Start motion demo</button><button class="danger" id="estop">EMERGENCY STOP</button><div class="slider"><label><span>Motion speed</span><output id="speedOut">1.0×</output></label><input id="speed" type="range" min="0.2" max="2" step="0.1" value="1"></div><div class="slider"><label><span>Joint amplitude</span><output id="ampOut">18°</output></label><input id="amp" type="range" min="4" max="35" step="1" value="18"></div><h2>14 joints</h2><div class="joints" id="joints"></div></aside><main class="stage"><canvas id="view"></canvas><div class="hud">MODE <strong id="mode">NEUTRAL</strong> · IMU HEALTHY · 14/14 SERVOS</div><div class="hint">Kéo để xoay · Cuộn để zoom · Double-click để reset góc nhìn</div></main></div><script type="module" src="./viewer-app.mjs"></script></body></html>
